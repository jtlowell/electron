<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reddit Product Search - Electron Demo</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      line-height: 1.6;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .search-section {
      padding: 40px;
      border-bottom: 1px solid #e1e8ed;
    }

    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      padding: 15px 20px;
      font-size: 16px;
      border: 2px solid #e1e8ed;
      border-radius: 8px;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .search-button {
      padding: 15px 40px;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .search-button:active {
      transform: translateY(0);
    }

    .search-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .option-group {
      display: flex;
      flex-direction: column;
    }

    .option-group label {
      font-size: 14px;
      font-weight: 600;
      color: #657786;
      margin-bottom: 5px;
    }

    .option-group input,
    .option-group select {
      padding: 10px;
      border: 2px solid #e1e8ed;
      border-radius: 6px;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      display: none;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      font-size: 16px;
      color: #657786;
    }

    .results {
      padding: 40px;
      display: none;
    }

    .results.active {
      display: block;
    }

    .results-header {
      margin-bottom: 30px;
    }

    .results-header h2 {
      font-size: 2em;
      color: #14171a;
      margin-bottom: 10px;
    }

    .results-stats {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 2em;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 14px;
      color: #657786;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #e1e8ed;
      margin-bottom: 30px;
    }

    .tab {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      color: #657786;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab:hover {
      color: #667eea;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .product-list {
      display: grid;
      gap: 20px;
    }

    .product-card {
      background: #f7f9fa;
      border-radius: 12px;
      padding: 24px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .product-name {
      font-size: 1.5em;
      font-weight: 700;
      color: #14171a;
    }

    .product-stats {
      display: flex;
      gap: 15px;
      font-size: 14px;
      color: #657786;
      margin-bottom: 15px;
    }

    .product-stats span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .product-mentions {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .mention {
      padding: 12px;
      background: white;
      border-left: 4px solid #667eea;
      margin-bottom: 10px;
      font-style: italic;
      color: #5c6b75;
      border-radius: 4px;
    }

    .mention:last-child {
      margin-bottom: 0;
    }

    .mention-score {
      font-weight: 600;
      color: #667eea;
      margin-left: 10px;
    }

    .post-list {
      display: grid;
      gap: 20px;
    }

    .post-card {
      background: #f7f9fa;
      border-radius: 12px;
      padding: 24px;
    }

    .post-title {
      font-size: 1.3em;
      font-weight: 700;
      color: #14171a;
      margin-bottom: 10px;
    }

    .post-meta {
      display: flex;
      gap: 15px;
      font-size: 14px;
      color: #657786;
      margin-bottom: 15px;
    }

    .post-summary {
      color: #5c6b75;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .post-link {
      display: inline-block;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .post-link:hover {
      text-decoration: underline;
    }

    .insights-list {
      display: grid;
      gap: 15px;
    }

    .insight {
      background: #f7f9fa;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }

    .report-section {
      background: #f7f9fa;
      padding: 30px;
      border-radius: 12px;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.8;
      overflow-x: auto;
    }

    .error {
      background: #fee;
      border: 2px solid #fcc;
      border-radius: 8px;
      padding: 20px;
      color: #c33;
      margin: 20px;
      display: none;
    }

    .error.active {
      display: block;
    }

    .export-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .export-button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .export-button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Reddit Product Search</h1>
      <p>Discover product recommendations from Reddit's most engaged communities</p>
    </div>

    <div class="search-section">
      <form class="search-form" id="searchForm">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Enter product category (e.g., headphones, laptops, coffee makers)"
          required
        />
        <button type="submit" class="search-button" id="searchButton">
          Search Reddit
        </button>
      </form>

      <div class="options">
        <div class="option-group">
          <label for="maxSubreddits">Max Subreddits</label>
          <input type="number" id="maxSubreddits" value="5" min="1" max="10" />
        </div>
        <div class="option-group">
          <label for="maxPosts">Max Posts per Subreddit</label>
          <input type="number" id="maxPosts" value="25" min="5" max="100" />
        </div>
        <div class="option-group">
          <label for="maxComments">Max Comments per Post</label>
          <input type="number" id="maxComments" value="50" min="10" max="200" />
        </div>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Searching Reddit and analyzing discussions...</div>
    </div>

    <div class="error" id="error"></div>

    <div class="results" id="results">
      <div class="results-header">
        <h2 id="resultsTitle">Results</h2>
        <div class="results-stats">
          <div class="stat">
            <div class="stat-value" id="statSubreddits">0</div>
            <div class="stat-label">Subreddits</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="statPosts">0</div>
            <div class="stat-label">Posts</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="statComments">0</div>
            <div class="stat-label">Comments</div>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="products">Top Products</button>
        <button class="tab" data-tab="insights">Key Insights</button>
        <button class="tab" data-tab="discussions">Top Discussions</button>
        <button class="tab" data-tab="report">Full Report</button>
      </div>

      <div class="tab-content active" id="tab-products">
        <div class="product-list" id="productList"></div>
      </div>

      <div class="tab-content" id="tab-insights">
        <div class="insights-list" id="insightsList"></div>
      </div>

      <div class="tab-content" id="tab-discussions">
        <div class="post-list" id="postList"></div>
      </div>

      <div class="tab-content" id="tab-report">
        <div class="export-buttons">
          <button class="export-button" id="exportMarkdown">Export as Markdown</button>
          <button class="export-button" id="exportJSON">Export as JSON</button>
          <button class="export-button" id="exportHTML">Export as HTML</button>
        </div>
        <div class="report-section" id="reportContent"></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
